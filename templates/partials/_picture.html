{% load static seo_extras %}
<picture>
	<source srcset="{% static src|to_webp %}" type="image/webp">
	<img src="{% static src %}" alt="{{ alt }}"{% if width %} width="{{ width }}"{% endif %}{% if height %} height="{{ height }}"{% endif %} loading="{{ loading|default:'lazy' }}"{% if fetchpriority %} fetchpriority="{{ fetchpriority }}"{% endif %} decoding="async">
</picture>
